name: Release APK

# Push a tag like v0.1.0 (or run this workflow by hand and type the version) to build, sign and publish an APK
# as a GitHub Release. Running by hand creates the tag on the chosen branch for you.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # arm64 covers practically every phone made since ~2017 and is the only ARM build tested in CI so far.
      # Add armeabi-v7a (old 32-bit phones) or x86_64 (emulators) here if needed.
      ARCHS: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v (see docs/RELEASING.md)"; exit 1; fi
          done

      - name: Fetch segmentation model (SHA-256 verified)
        working-directory: .
        run: ./scripts/fetch-model.sh

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (unsigned by us; Gradle uses the template debug key)
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=$ARCHS -Dorg.gradle.jvmargs=-Xmx4g

      - name: Align and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          IN="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          OUT="rago-lens-${TAG}.apk"
          # keytool stores aliases in lower case, and a typo in the KEY_ALIAS secret is easy to make, so look inside the
          # keystore: use KEY_ALIAS if it is a private-key entry, otherwise the first private-key entry found.
          LIST="$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>&1)" || { echo "$LIST"; echo "::error::Could not open the keystore: KEYSTORE_PASSWORD or KEYSTORE_BASE64 is wrong"; exit 1; }
          echo "Keystore entries:"; echo "$LIST" | grep -E "Entry|entry" || true
          ALIAS="$KEY_ALIAS"
          if ! echo "$LIST" | grep -iE "^${KEY_ALIAS}," | grep -q PrivateKeyEntry; then
            ALIAS="$(echo "$LIST" | awk -F, '/PrivateKeyEntry/{print $1; exit}')"
            if [ -z "$ALIAS" ]; then echo "::error::The keystore contains no private key (PrivateKeyEntry). Create it with keytool -genkeypair (see docs/RELEASING.md)"; exit 1; fi
            echo "::warning::KEY_ALIAS secret did not match a key in the keystore; using '$ALIAS' instead. Update the secret to silence this."
          fi
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          if ! "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"; then
            # PKCS12 keystores (the keytool default) use the store password for the key as well
            echo "::warning::KEY_PASSWORD did not unlock the key; retrying with KEYSTORE_PASSWORD (PKCS12 keystores use the same password)."
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          fi
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f "$KS"
          echo "APK_PATH=app/$OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
